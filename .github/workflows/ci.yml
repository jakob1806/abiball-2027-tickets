# Prüfungen für jeden Pull Request (Website + Datenbank-Migrationen in einer leeren Test-Datenbank).
# Welche Migrationen in Produktion laufen würden, zeigt supabase-migrations.yml.
name: Prüfungen

on:
  pull_request:
    paths-ignore:
      - "scanner-app/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  web:
    name: Website (Typen, Lint, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  migrations:
    name: Datenbank-Migrationen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regeln prüfen (Namen, Reihenfolge, nichts Bestehendes verändert)
        env:
          BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ] && ! git rev-parse --verify --quiet "$BASE_REF^{commit}" >/dev/null; then
            echo "Basis $BASE_REF nicht gefunden, prüfe nur Namen und Nummern."
            BASE_REF=""
          fi
          node scripts/check-migrations.mjs ${BASE_REF:+"$BASE_REF"}

      - name: Alle Migrationen in leerer Datenbank ausführen
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/setup.sql
          for f in supabase/migrations/*.sql; do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 -q --single-transaction -f "$f"
            echo "::endgroup::"
          done

      - name: Rauchtest (Kauf, Tickets, Einlass, Abendkasse)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/smoke.sql
