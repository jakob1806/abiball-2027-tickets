name: AbiballEinlass
options:
  bundleIdPrefix: de.abiballwbg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: DVH3MYQ64A
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # Version NICHT erhöhen: neue Versionsnummer = neue volle Beta-Prüfung bei Apple. Nur die Buildnummer zählt (Xcode Cloud).
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  AbiballEinlass:
    type: application
    platform: iOS
    sources: [AbiballEinlass]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.abiballwbg.scanner
        PRODUCT_NAME: AbiballEinlass
        INFOPLIST_FILE: AbiballEinlass/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: AbiballEinlass/Info.plist
      properties:
        CFBundleDisplayName: Einlass
        CFBundleName: Abiball Einlass
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        LSApplicationCategoryType: public.app-category.utilities
        NSCameraUsageDescription: "Die Kamera wird zum Scannen der QR-Codes auf den Abiball-Tickets benötigt."
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIUserInterfaceStyle: Light
schemes:
  AbiballEinlass:
    shared: true
    build:
      targets:
        AbiballEinlass: all
    run:
      config: Debug
    archive:
      config: Release
